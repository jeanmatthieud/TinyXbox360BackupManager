[workspace]
resolver = "3"
members = ["crates/core", "crates/gui"]
default-members = ["crates/gui"]

[workspace.package]
version = "0.11.0"
rust-version = "1.96"
edition = "2024"
authors = ["Jean-Matthieu <jeanmatthieu@digital-balloon.fr>"]
license = "GPL-3.0-only"
repository = "https://github.com/jeanmatthieud/TinyXbox360BackupManager"
description = "A tiny game backup manager for the Xbox 360 (Aurora)"

[workspace.dependencies]
anyhow = "1.0"
# FATX (the Xbox/Xbox 360 filesystem), for reading and writing a console hard
# drive plugged straight into this computer. Write support lives on the
# `feat-rust-write` branch of our fork, not on crates.io. The commit is pinned
# here rather than tracking the branch head, so picking up new work there is a
# deliberate bump of this `rev`.
fatx = { git = "https://github.com/jeanmatthieud/fatx", rev = "d1b3870f1514a7b79d57c704d07fd2c20b3a7a08" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# speed up slint compiler in dev builds
[profile.dev.build-override]
opt-level = 2

# speed up conversions in dev builds
[profile.dev.package."*"]
opt-level = 2
