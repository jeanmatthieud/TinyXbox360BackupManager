<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<!--
  Installed as /app/etc/fonts/local.conf, which the Flatpak runtime's fontconfig
  includes when present.

  The UI names no font: Slint asks fontconfig for the default sans-serif. The
  sandbox sees the host's font *files* (/run/host/fonts) but not the host's
  fontconfig *preferences*, so the runtime's own default (DejaVu Sans) wins and
  the Flatpak looks unlike the same binary run outside it. Noto Sans is what
  most desktops resolve sans-serif to; where the host does not have it, this
  rule matches nothing and the runtime's default applies as before.
-->
<fontconfig>
  <!--
    A strong prepend rather than an <alias>: the runtime's own rules also put
    DejaVu Sans ahead of an explicit "sans-serif", and a weakly bound alias
    loses to them. Fonts asked for by name are left alone.
  -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans</string>
    </edit>
  </match>
</fontconfig>
