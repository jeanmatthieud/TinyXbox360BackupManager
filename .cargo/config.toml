# Raise the main thread stack from the Windows default of 1 MiB to 8 MiB.
# Slint generates deeply nested component trees and the app overflows the stack
# at startup without this. Release builds get the same flag from the
# CARGO_TARGET_*_RUSTFLAGS env vars in .github/workflows/release.yml, which
# override (rather than extend) the values below.

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8000000"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8000000"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8000000"]
